<section class="hero-card">
  <!-- Contenedor del Avatar con botón para ampliar -->
  <div class="avatar-container">
    <button
      type="button"
      class="avatar-trigger-btn"
      (click)="openPhotoModal()"
      title="Haz clic para ver la imagen en alta resolución"
      aria-label="Abrir imagen de perfil completa"
    >
      <img [src]="photoThumbnailUrl()" [alt]="name()" class="avatar" />
      <span class="zoom-badge">
        <svg
          viewBox="0 0 24 24"
          width="14"
          height="14"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
        >
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          <line x1="11" y1="8" x2="11" y2="14"></line>
          <line x1="8" y1="11" x2="14" y2="11"></line>
        </svg>
      </span>
    </button>
  </div>

  <div class="hero-info">
    <h1 class="name">{{ name() }}</h1>
    <h2 class="title">{{ title() }}</h2>
    <p class="bio">{{ bio() }}</p>

    <div class="actions">
      <!-- Botón de Descarga de CV con icono SVG -->
      <a
        href="/cv-sonia-carrasco.pdf"
        download="CV_Sonia_Carrasco.pdf"
        class="btn btn-cv"
        title="Descargar Curriculum Vitae en PDF"
      >
        <svg
          class="download-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        <span>Descargar CV</span>
      </a>

      <a routerLink="/proyectos" class="btn btn-primary">Ver mis Proyectos</a>
      <a
        href="https://github.com/soniacarrasco-dev"
        target="_blank"
        rel="noopener noreferrer"
        class="btn btn-outline"
        >GitHub</a
      >
      <a routerLink="/contacto" class="btn btn-outline">Contacto</a>
    </div>
  </div>
</section>

<section class="skills-block">
  <h3>Stack & Competencias Técnicas</h3>
  <div class="skills-grid">
    @for (skill of skills(); track skill) {
      <div class="skill-item"><span class="bullet">▹</span> {{ skill }}</div>
    }
  </div>
</section>

<!-- MODAL / LIGHTBOX PARA AMPLIAR LA FOTO -->
@if (isModalOpen()) {
  <div
    class="modal-backdrop"
    (click)="closePhotoModal()"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="'Foto ampliada de ' + name()"
  >
    <div class="modal-content" (click)="$event.stopPropagation()">
      <button
        type="button"
        class="btn-close-modal"
        (click)="closePhotoModal()"
        aria-label="Cerrar vista previa"
      >
        ✕
      </button>

      <img [src]="photoOriginalUrl()" [alt]="name()" class="modal-image" />

      <div class="modal-footer">
        <span>{{ name() }}</span>
        <a
          [href]="photoOriginalUrl()"
          target="_blank"
          rel="noopener noreferrer"
          class="open-tab-link"
        >
          Abrir original en pestaña nueva &nearr;
        </a>
      </div>
    </div>
  </div>
}
