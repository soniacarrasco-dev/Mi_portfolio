<div class="layout">
  <header class="navbar">
    <a routerLink="/" class="brand">Sonia<span>.dev</span></a>
    <button
      type="button"
      class="menu-toggle"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      [attr.aria-label]="menuOpen() ? 'Cerrar menú' : 'Abrir menú'"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>
    <nav class="nav-links" [class.is-open]="menuOpen()" (keydown.escape)="closeMenu()">
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeMenu()"
        >Inicio</a
      >
      <a routerLink="/proyectos" routerLinkActive="active" (click)="closeMenu()">Proyectos</a>
      <a routerLink="/experiencia-fullstack" routerLinkActive="active" (click)="closeMenu()"
        >Angular + NestJS</a
      >
    </nav>
  </header>

  <main class="content">
    <router-outlet />
  </main>

  <footer class="footer">
    <p>© 2026 Sonia Carrasco — Desarrolladora Web Frontend</p>
  </footer>
</div>
